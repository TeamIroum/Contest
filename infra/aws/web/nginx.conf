# WEB EC2(공개 서브넷) 역방향 프록시 견본. 프론트(React + Vite) 빌드 결과 dist/를 내려 주고 /api, /actuator/health만 WAS로 넘긴다.
# 시니어 앱(frontend/senior) 한 개 기준이다. 두 앱 모두 Vite base가 '/'라, 관리자 웹(frontend/admin)은 다른 호스트의
# server 블록(같은 /api 프록시, root /var/www/admin)으로 두거나 프론트 쪽 base 변경이 필요하다(AWS_배포_준비.md 1·9절).
# 같은 출처로 묶어 __Host- 쿠키·CSRF 쿠키가 그대로 동작하게 한다(사진_보관과_인증_정책.md).
# <도메인>, <was-private-ip>는 배포 때 채운다. 인증서는 /etc/letsencrypt(또는 결정된 발급 방식) 경로를 쓴다.

server {
    listen 80;
    server_name <도메인>;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

upstream was {
    server <was-private-ip>:8080;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <도메인>;

    ssl_certificate     /etc/letsencrypt/live/<도메인>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<도메인>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;

    # 사진 multipart: 파일 10MiB, 요청 11MB(application.yml). 여유를 둔다.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://was;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 덧붙이지 않고 덮어써 클라이언트가 보낸 값을 버린다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # 사진 접수는 AI 판독(요청 기한 30초)을 기다린다. 업무 서버 기한보다 길게 둔다.
        proxy_read_timeout 90s;
        proxy_send_timeout 60s;
        # 사진 원본이 프록시 디스크에 남지 않게 요청 본문을 버퍼링하지 않는다(업무 API 6.3절 취지).
        proxy_request_buffering off;
        client_body_buffer_size 12m;
        # 사진 응답(no-store)도 프록시 디스크 캐시에 쓰지 않는다.
        proxy_max_temp_file_size 0;
    }

    location = /actuator/health {
        allow 10.0.0.0/16;
        deny all;
        proxy_pass http://was;
    }

    # 앱 화면(vite build 결과 dist/의 내용을 /var/www/app에 둔다).
    # index.html·서비스 워커(sw.js, 생기면)·웹 앱 매니페스트·모델 목록은 이름이 바뀌지 않으므로 짧게,
    # 해시 붙은 assets/와 버전 붙은 모델 파일(models/*@<버전>.onnx)은 길게 캐시(infra/ec2/README.md).
    # 주의: location 안에 add_header가 있으면 server의 add_header(HSTS·nosniff)를 물려받지 않는다. 배포 전 응답 헤더를 확인한다.
    root /var/www/app;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /models/model-manifest.json { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /models/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
