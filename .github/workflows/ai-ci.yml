name: ai-ci

on:
  pull_request:
    paths: ["ai/**", ".github/workflows/ai-ci.yml"]
  push:
    branches: [main]
    paths: ["ai/**", ".github/workflows/ai-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  yunet-web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai/contract/yunet_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai/contract/yunet_web/package-lock.json
      - run: npm ci
      - run: node verify.mjs
