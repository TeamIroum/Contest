# 로컬 개발 전용 프로필(--spring.profiles.active=local). 가상 시연 데이터 seed를 함께 적용한다.
# 운영·기본 프로필에서는 seed 위치를 읽지 않는다.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed

# 시연 설정. 고정 시연 코드는 환경 변수로만 받는다(비어 있으면 시연 OTP 경로 404).
# 시니어 번호는 실제 번호가 아닌 가상 번호(010-0000-000x)만 쓴다.
inspection:
  demo:
    enabled: true
    otp-code: ${DEMO_OTP_CODE:}
    seniors:
      - user-id: 10000000-0000-4000-8000-000000000001
        phone: 010-0000-0001
      - user-id: 10000000-0000-4000-8000-000000000002
        phone: 010-0000-0002
    # 관리자 시연 계정 로그인 ID. 임시 비밀번호는 환경 변수로만 받고 첫 로그인에 바꾼다(D-22·D-23).
    admins:
      - user-id: 10000000-0000-4000-8000-000000000021
        login-id: demo-activity
      - user-id: 10000000-0000-4000-8000-000000000011
        login-id: demo-road
      - user-id: 10000000-0000-4000-8000-000000000012
        login-id: demo-sewer
    admin-temporary-password: ${DEMO_ADMIN_TEMP_PASSWORD:}
