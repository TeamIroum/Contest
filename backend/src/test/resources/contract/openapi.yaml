components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    restrictedCookie:
      type: apiKey
      in: cookie
      name: __Host-password-change
      description: D-23 제한 세션 10분. 업무 API 사용 불가
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-itda-refresh
      description: Secure; HttpOnly; SameSite=Lax; Path=/; Domain 없음. Max-Age는 D-15 세션 절대 만료까지 남은 초. 갱신해도 절대 만료 연장 금지.
  schemas:
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Actor:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    Retry:
      type: object
      additionalProperties: false
      properties:
        pending:
          type: boolean
        attempts:
          type: integer
          minimum: 0
        nextAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        gaveUp:
          type: boolean
      required:
      - pending
      - attempts
      - nextAt
      - gaveUp
    Finding:
      type: object
      additionalProperties: false
      properties:
        facilityType:
          type: string
          enum:
          - SIDEWALK
          - DRAIN
          - BENCH
          - SAFETY_FENCE
          - EXERCISE_EQUIPMENT
          - PARK_EQUIPMENT
          - SNOW_REMOVAL_BIN
          - SHADE_STRUCTURE
        code:
          type: string
        label:
          type: string
        bbox:
          anyOf:
          - type: array
            items:
              type: number
              minimum: 0
              maximum: 1
            minItems: 4
            maxItems: 4
          - type: 'null'
        evidence:
          type: string
      required:
      - facilityType
      - code
      - label
      - bbox
      - evidence
    Media:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        mediaVersion:
          type: integer
          minimum: 1
        privacyStatus:
          type: string
          enum:
          - APPROVED
          - QUARANTINED
          - REJECTED
        contentPath:
          type: string
          description: 승인 상태에서 인증 fetch로 조회. 비공개 객체 저장소 주소가 아님
        privacyRelease:
          description: 보류 해제(재승인) 처리 상태. 보류가 없거나 보류 중 재승인 결정이 없으면 null(단순 보류는 privacyStatus=QUARANTINED + null). 관리자 응답 전용
          anyOf:
          - $ref: '#/components/schemas/PrivacyRelease'
          - type: 'null'
      required:
      - id
      - mediaVersion
      - privacyStatus
      - contentPath
      - privacyRelease
      allOf:
      - if:
          required:
          - privacyRelease
          properties:
            privacyRelease:
              type: object
              required:
              - status
              properties:
                status:
                  enum:
                  - PENDING
                  - FAILED
                  - INVALIDATED
        then:
          properties:
            privacyStatus:
              const: QUARANTINED
      - if:
          required:
          - privacyRelease
          properties:
            privacyRelease:
              type: object
              required:
              - status
              properties:
                status:
                  const: COMPLETED
        then:
          properties:
            privacyStatus:
              const: APPROVED
    PrivacyRelease:
      type: object
      additionalProperties: false
      description: 개인정보 보류 해제(재승인) 처리 상태. 현재 보류 기간의 가장 최근 재승인 결정이다. 업무 API 9.3절.
      properties:
        releaseId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - FAILED
          - COMPLETED
          - INVALIDATED
          description: PENDING 처리 중(AI 해제 전송·자동 재시도 대기), FAILED 자동 재시도 소진 또는 AI 거절(담당자 재요청 가능), COMPLETED 공개 완료, INVALIDATED
            재가림·새 보류로 무효(새 결정 필요)
        decidedAt:
          type: string
          format: date-time
        decidedMediaVersion:
          type: integer
          minimum: 1
          description: 결정 시점의 사진 내용 버전(mediaVersion)
        attempts:
          type: integer
          minimum: 0
          description: AI 해제 전송 누적 시도 수(자동·재요청 합산)
        nextRetryAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: PENDING에서 다음 자동 재시도 예정 시각. 그 밖에는 null
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        failureReason:
          anyOf:
          - type: string
            enum:
            - RETRY_EXHAUSTED
            - PROVIDER_REJECTED
          - type: 'null'
          description: FAILED일 때만. RETRY_EXHAUSTED 일시 장애 자동 재시도 소진, PROVIDER_REJECTED AI가 요청 형식·권한·대상 오류로 거절(자동 반복 안 함, 운영
            확인 후 재요청)
        invalidReason:
          anyOf:
          - type: string
            enum:
            - REMASKED
            - NEW_PRIVACY_HOLD
          - type: 'null'
          description: INVALIDATED일 때만. REMASKED 재가림으로 사진 버전 변경, NEW_PRIVACY_HOLD 새 보류(AI 보류·새 부족 판정)
        retryable:
          type: boolean
          description: 담당자 재요청(POST privacy-release-retries) 가능 여부. FAILED일 때만 true
      required:
      - releaseId
      - status
      - decidedAt
      - decidedMediaVersion
      - attempts
      - nextRetryAt
      - completedAt
      - failureReason
      - invalidReason
      - retryable
      allOf:
      - if:
          properties:
            status:
              const: FAILED
        then:
          properties:
            failureReason:
              type: string
            retryable:
              const: true
        else:
          properties:
            failureReason:
              type: 'null'
            retryable:
              const: false
      - if:
          properties:
            status:
              const: INVALIDATED
        then:
          properties:
            invalidReason:
              type: string
        else:
          properties:
            invalidReason:
              type: 'null'
      - if:
          properties:
            status:
              const: COMPLETED
        then:
          properties:
            completedAt:
              type: string
