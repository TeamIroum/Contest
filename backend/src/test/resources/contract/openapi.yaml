          description: 'reason으로 분기한다(D-30·D-32). NOT_STARTED 시작 전 앱 복귀 요청, SOLO_DEPARTURE 참여 가능 인원(배정 중·ABSENT 아님) 1명 이하
            출발, MEMBER_ABSENT 결석 확정 조원의 시작·복귀 확인·시각 정정, MEMBER_ALREADY_ACTIVE 시작·복귀 기록이 있는 조원의 결석 처리, RETURN_ALREADY_CONFIRMED
            이미 다른 구분으로 복귀 확인된 조원(저장 안 함), MEMBER_TRANSFERRED 이 조에서 다른 조로 이동한 조원의 새 기록·확인, 이동(D-34): SAME_PATROL·TARGET_SCOPE_MISMATCH·SOURCE_NOT_ACTIVE·MEMBER_NOT_ASSIGNED·MEMBER_RETURNED·TARGET_NOT_ACTIVE·MEMBER_ALREADY_IN_TARGET·TARGET_FULL(현장
            조원 3명)·SCHEDULE_OVERLAP, SOLO_WAITING 발생 시각이 이 조원의 혼자 남은 대기 구간 안인 새 건너뛰기(D-35·D-38), MEMBER_RETURNED는 이동 대상이 이미
            복귀 확인된 조원이거나 건너뛰기 발생 시각이 보낸 조원의 실제 복귀 뒤인 경우, ALREADY_DEPARTED 이미 출발한 순회의 재점검 배정 추가·취소·이동(06단계)'
