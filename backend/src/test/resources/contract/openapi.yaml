  /patrols/{patrolId}/stops/{stopId}/inspections:
    post:
      operationId: submitPhoto
      summary: 마스킹 사진 제출
      tags:
      - senior
      description: '동일 사진 clientSubmissionId/attemptId 유지. 새 촬영은 새 ID. 기한은 활동일 다음날00:00 Asia/Seoul 미만. 서버검사 전 바이트 영속저장 금지.
        파일 최대10MiB, 실패413/415. RECEIVED는 영속 접수, ACCEPTED는 사진 채택이지 안전 판정이 아님. D-27: 담당자 기록 실제 개인 returnedAt 전후 비교. 복귀 이전 촬영본은
        당일 기한 내 종료 상태에서도 접수, 복귀 이후 신규 촬영은422 PHOTO_AFTER_RETURN. NOT_VISITED는 적법한 늦은 증거로 보완 가능하나 명시 SKIPPED/검토인계 구도를 재개하지
        않음. 늦은 실패는 추가 현장 촬영 대신 검토 인계. 완료 상태 유지. 종료 후 늦게 접수된 사진의 nextAction은 RETURN_TO_CENTER(전송 완료 안내)이며 복귀 요청을 다시 보내지 않음.
        AI 처리 불가는 422 IMAGE_PROCESSING_FAILED(진행 중 새 촬영, 복귀 후 늦은 전송은 검토 인계·담당자 확인), AI 연결 불가는 503 ANALYSIS_UNAVAILABLE(RETRY_REQUIRED).'
      parameters:
      - name: patrolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: stopId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
