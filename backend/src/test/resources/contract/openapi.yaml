      - auth
      description: 역할과 배정·기관·관할 범위를 서버에서 확인한다.
      parameters: []
      responses:
        '200':
          description: 업무 서버 구현(로컬).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
              examples:
                csrf_200_json:
                  value:
                    csrfToken: csrf-example-token-not-real
                  x-source-file: examples/01-auth/csrf.200.json
        '401':
          description: 공통 오류; 해당 동작에 적용되는 코드만 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError401'
        '403':
          description: 공통 오류; 해당 동작에 적용되는 코드만 반환
          content:
            application/json:
              schema:
