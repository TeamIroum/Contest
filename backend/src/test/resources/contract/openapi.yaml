  /auth/sms-verifications:
    post:
      operationId: verifySms
      summary: 인증번호 검증
      tags:
      - auth
      description: 역할과 배정·기관·관할 범위를 서버에서 확인한다. 비밀번호 변경 의무가 있는 계정은 403 FORBIDDEN(details.reason=PASSWORD_CHANGE_REQUIRED)으로
        거절하고 관리자 로그인 안내.
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: GET /auth/csrf로 획득. 쿠키·Origin 검증과 함께 적용
      responses:
        '200':
          description: 업무 서버 구현(로컬).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                token_senior_200_json:
                  value:
                    tokenType: Bearer
                    accessToken: eyJhbGciOiJFUzI1NiJ9.example.signature
                    accessTokenExpiresAt: '2026-10-15T00:15:00Z'
                    refreshTokenExpiresAt: '2026-10-22T00:00:00Z'
                    sessionId: c0000000-0000-4000-8000-000000000001
                    user:
                      id: 10000000-0000-4000-8000-000000000001
                      name: 김○○
                      roles:
                      - SENIOR
                  x-source-file: examples/01-auth/token.senior.200.json
          headers:
            Set-Cookie:
              schema:
                type: string
              description: '일반 로그인: Secure/HttpOnly Refresh 쿠키. 제한 로그인: __Host-password-change; Secure; HttpOnly; SameSite=Strict;
                Path=/; Max-Age=600. 토큰 쿠키 값은 JS/JSON에 노출하지 않음'
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          description: 공통 오류; 해당 동작에 적용되는 코드만 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError400'
        '401':
          description: 공통 오류; 해당 동작에 적용되는 코드만 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError401'
        '403':
          description: 'FORBIDDEN. CSRF 실패는 details=null. 비밀번호 변경 의무(D-23)가 있는 계정(예: SENIOR·관리자 겸임)은 인증번호가 맞아도 일반 토큰을 받지 못하며
            details.reason=PASSWORD_CHANGE_REQUIRED다. 이때 Refresh 쿠키를 주지 않는다. 프론트는 reason으로 분기해 관리자 로그인(POST /auth/admin/sessions
            → 제한 세션 → POST /auth/password-changes)을 안내한다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError403'
              examples:
                error_password-change-required_403_json:
                  value:
                    code: FORBIDDEN
                    message: 관리자 로그인에서 비밀번호를 먼저 변경해 주세요.
                    requestId: req-0101
                    fieldErrors: []
                    details:
                      reason: PASSWORD_CHANGE_REQUIRED
                  x-source-file: examples/01-auth/error.password-change-required.403.json
        '404':
          description: 공통 오류; 해당 동작에 적용되는 코드만 반환
          content:
            application/json:
              schema:
