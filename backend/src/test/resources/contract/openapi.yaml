        반환한다. 처리 중에는 QUARANTINED. 권한: 사진 시설의 현재 관리 부서 FACILITY_MANAGER(범위 밖 404). Idempotency-Key 필수: 같은 키·같은 본문은 최초 결과 재현,
        다른 본문은 409 IDEMPOTENCY_CONFLICT. version이 현재 사진 기록과 다르면 409 VERSION_CONFLICT, release가 최신 처리가 아니거나 FAILED가 아니면 409
        PRIVACY_RELEASE_CONFLICT. 재가림·새 보류로 INVALIDATED된 처리는 재요청할 수 없고 privacy-reviews로 새 결정을 내린다. 업무 API 9.3절.'
