# 0.3.3: D-33~39의 03단계 범위 반영(docs/03단계_API_DB_설계안.md). 사진 접수(D-36 사진 귀속, D-39)는 04단계.
openapi: 3.1.0
info:
  title: ITDA 프론트 연결 API
  version: 0.4.0
  description: '업무 백엔드 개발 계약. 2026-10-13 기준 로컬 업무 서버가 인증·순회·사진 접수·AI 업무 어댑터·개인정보 보류 해제·사진 조회와 05단계 검토 목록·상세·판정·관리자 사진 상세·분류 정정을 구현했다(각 응답 설명 참고). 06단계 10절은 기능별로 추가한다(0.4.0: 시설 문제 목록·상세 ISSUE-01, 보수 요청·착수·완료 REPAIR-01, 재점검 요청 목록·배정·취소 REINSPECT-01, 수리 확인 준비·판정·이력 VERIFY-01, 보수 증거 사진 업로드 MEDIA-UP-01. AI 비교는 미연결). 각 동작 설명의 기능 ID가 구현 범위다. 엑셀·보고·계정 관리(11절 등)는 이 문서에 없는 후속 범위다. D-01~27, 업무 API v1.4, 응답 JSON v0.4를 기계 판독 형식으로 정리. 가상 예시만 포함. 보수/엑셀/계정관리 전체 화면/기준데이터 편집/연락·대응
    기록 API는 별도 후속 범위. AI 내부 API 직접 호출 금지. Nullable과 생략은 구분. 실제 배포 주소/CORS Origin은 배포 전에 확정. 0.2.1: 분석 reviewCategory의 RETAKE/ERROR
    null 조건, 조원 participantId·정정 correctionId null 불가, 동작별 409/422/503 오류 코드 범위, 동작 설명 정리, 종료 후 늦은 사진 접수 예시 추가. 0.2.2: 모든
    동작에 500 INTERNAL_ERROR 응답 추가. 0.2.3: 인증번호 검증의 403 FORBIDDEN details.reason=PASSWORD_CHANGE_REQUIRED(비밀번호 변경 의무 계정, 관리자
    로그인 안내). 0.2.4: retakeReason에서 NO_FACILITY 삭제(시설 안 보임은 품질 실패가 아니라 담당자 검토, retakeReason=null). 검사본 저장·재판독 없음·담당자 검토 필요는
    200 RECEIVED/REVIEW_REQUESTED 예시 추가(nextAction은 구도·활동 상태 규칙). 개인정보 재승인 공개 순서 설명(스키마 변경 없음). 0.2.5: 개인정보 보류 해제 처리 상태(PrivacyRelease:
    PENDING/FAILED/COMPLETED/INVALIDATED)를 사진 상세·검토 상세 media.privacyRelease와 개인정보 검토 결과 release로 제공, 재요청 POST /admin/media/{mediaId}/privacy-release-retries,
    409 PRIVACY_RELEASE_CONFLICT. 0.2.6: 409 ACTIVITY_STATE_CONFLICT(reason NOT_STARTED/SOLO_DEPARTURE/MEMBER_ABSENT/MEMBER_ALREADY_ACTIVE,
    D-30·D-32). 0.3.0(D-33·D-36·D-37 구현): 개인별 복귀 요청·확인(members[].returnReason/abortReason/returnRequest), 종료 상태 ENDED 하나(COMPLETED/ABORTED
    삭제)와 불변 종료 기록 end, 관리자 currentOutcomes·supplementedAfterEnd·pendingReturnConfirmations, 복귀 확인 alreadyConfirmed, RETURN_REASON_CONFLICT
    삭제, ACTIVITY_STATE_CONFLICT.reason에 RETURN_ALREADY_CONFIRMED. 0.3.1(D-37): 출결 correctionReason(결석→출석 정정 필수)·변경 이력, 출결
    결과 correctionReason·pendingReturnConfirmation, 종료 후 보완 집계에 출결 변경 포함. 0.3.2(D-34·D-36): 조 이동 GET .../members/{participantId}/transfer-candidates,
    POST .../transfers, 시니어 myAssignment, 관리자 members[].joinedAt·transferredFromPatrolId·formerMembers, startSource CARRIED,
    seatNo 상한 삭제(정원은 현장 조원 3명), ACTIVITY_STATE_CONFLICT 이동 사유값·transferredToPatrolId, VERSION_CONFLICT.details.which. 0.3.3(D-35·D-38):
    혼자 남은 대기 soloWaiting(Patrol·SyncState·AdminPatrol·목록), 개인 쉬기 members[].paused(조 단위 paused 삭제), 장소 skipPending, 건너뛰기 응답
    stopUpdated·nextAction WAIT_FOR_INSTRUCTION, ACTIVITY_STATE_CONFLICT SOLO_WAITING, 시니어 이벤트 요청 선택 필드 assignmentRef(멱등 해시
    제외·재전송 호환 검사). 0.3.4(04단계 PHOTO-02, 사진 접수 구현): submitPhoto 409에 ACTIVITY_STATE_CONFLICT(SOLO_WAITING: 촬영 시각이
    혼자 남은 대기 구간 안, MEMBER_TRANSFERRED: 이동 뒤 촬영), 422에 INVALID_ACTIVITY_TIME(촬영 시각이 미래·활동일 밖·합류 전), PhotoUpload 선택
    필드 assignmentRef(멱등 해시 제외, 다른 배정이면 첫 요청 400·재전송 409 SUBMISSION_CONFLICT). 응답 형식은 그대로. 0.3.5(D-40): getMedia에서 ACTIVITY_MANAGER가
    담당 순회의 승인 참고·점검 사진을 조회(그 밖 역할 범위는 그대로). 형식 변경 없음.'
servers:
- url: /api/v1
  description: 상대 prefix. 실제 업무 서버는 아직 없음
