        '429':
          description: 공통 오류; 해당 동작에 적용되는 코드만 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError429'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
              description: details.retryAfterSeconds와 동일한 초
        '503':
          description: 공통 오류; 해당 동작에 적용되는 코드만 반환
          content:
            application/json:
              schema:
