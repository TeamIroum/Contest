        갱신. 준비 때 고정한 증거 사본과 지금 사본이 다르면(재가림 등) 409 STALE_VERIFICATION(새 준비 필요), 같은 사본이 보류 중이면 400. 시설 담당자(현재 관할)만. 시설 잠금 뒤 관할 재확인 → 문제 → 요청 → 준비 → 사진 시도 → media 순으로 잠근다.'
