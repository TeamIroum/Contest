              type: string
              enum:
              - RETAKE
              - RETURN_TO_CENTER
            retakesRemaining:
              type: integer
              minimum: 0
              maximum: 2
              description: min(2,3-qualityFailureCount); 채택 후에도 실패 이력 유지
            patrolRevision:
