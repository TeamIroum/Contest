  /admin/media:
    post:
      operationId: uploadAdminMedia
      summary: 참고·보수 사진 업로드
      tags:
      - admin-issue
      description: 보수 증거 사진(REPAIR_EVIDENCE)을 AI /privacy/mask로 검사해 검사 완료본만 저장하고 문제(issueId)에 연결한다. 판독·실적에 넣지 않는다. 시설 담당자(문제 시설의 현재 관할)만. AI 연결 불가·일시 장애는 503 PRIVACY_SERVICE_NOT_READY(저장
        없음, 같은 키로 재시도), 마스킹 실패는 422 IMAGE_PROCESSING_FAILED. 저장 뒤 반영이 실패하면 저장 사본을 지운다. 보수 완료(repair-completions)의 evidenceMediaIds에는 같은 문제로 올린 사진만 쓸 수 있다.
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: GET /auth/csrf로 획득. 쿠키·Origin 검증과 함께 적용
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              - purpose
              - deviceMasked
              - deviceMaskReport
              - maskingVersion
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG/PNG, 10MiB 이하. 기기에서 가린 사진
                purpose:
                  type: string
                  enum:
                  - REFERENCE
                  - REPAIR_EVIDENCE
                  description: 지금은 REPAIR_EVIDENCE만 받는다(REFERENCE는 400, 06단계 E10)
                issueId:
                  type: string
                  format: uuid
                  description: REPAIR_EVIDENCE 필수. 문제가 REPAIR_REQUESTED·IN_REPAIR여야 한다
                organizationId:
                  type: string
                  format: uuid
                  description: REFERENCE용(미구현). REPAIR_EVIDENCE에는 보내지 않는다
                deviceMasked:
                  type: string
                  enum:
                  - 'true'
                deviceMaskReport:
                  type: string
                  description: 사진 제출과 같은 JSON 문자열
                maskingVersion:
                  type: string
                  maxLength: 50
      responses:
        '201':
          description: 업무 서버 구현(로컬, MEDIA-UP-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairEvidenceResult'
