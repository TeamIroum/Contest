    post:
      operationId: decideReview
      summary: 담당자 최종 판정
      tags:
      - admin-review
      description: 'D-25/26: issueResolutions[]로 같은 사진의 여러 문제 신규/기존 연결을 명시. 한 트랜잭션으로 판정·사건·증거 연결·감사·outbox를 처리하며 일부 실패 시 모두
        롤백. 각 inspectionId는 작업의 현재 승인 사진(현재 사본이 개인정보 승인 상태, 재승인 포함. 구도 채택은 복원하지 않음)이고 선택한 AI snapshot과 같은 사진. 기존 문제는 같은 사업·시설·현재 관할의 미종결 건만 허용. 기존 문제 상태를 초기화하거나 AI가
        자동 합치지 않음.'
      parameters:
      - name: reviewTaskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
