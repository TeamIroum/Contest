    put:
      operationId: attendanceUpdateResult
      summary: attendance/{participantId}
      tags:
      - admin-activity
      description: 담당자 출석 확정(PRESENT/ABSENT, D-01). 출석 요청 없이 PRESENT면 proxyReason 필수. 확정 결석을 PRESENT로 정정하면 출석 요청 유무와 무관하게
        correctionReason 필수(D-37, 없으면 400 fieldErrors.correctionReason). 저장마다 변경 이력을 남긴다. 시작 시각을 만들지 않음. 결석 확정으로 현장 조원이 0명이
        되고 복귀한 사람이 있으면 ENDED(D-30). 종료된 조에서도 저장하되 다시 열지 않음(D-37). ACTIVITY_MANAGER 담당 범위만.
