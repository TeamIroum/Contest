<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E4C5A"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0E4C5A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="cS"><rect x="60" y="190" width="320" height="130" rx="14"/></clipPath>
    <clipPath id="cA"><rect x="60" y="340" width="320" height="130" rx="14"/></clipPath>
    <clipPath id="cB"><rect x="500" y="190" width="340" height="280" rx="14"/></clipPath>
    <clipPath id="cI"><rect x="984" y="190" width="290" height="280" rx="14"/></clipPath>
    <clipPath id="cG"><rect x="1316" y="190" width="200" height="280" rx="14"/></clipPath>
    <style>
      .card{fill:#fff;stroke:#D5E9EE;stroke-width:1.5}
      .hd{font-size:22px;font-weight:700}
      .sub{font-size:14px}
      .b{font-size:17px;fill:#36494D}
      .lbl{font-size:14px;fill:#0E4C5A;font-weight:700}
      .ln{stroke:#0E4C5A;stroke-width:2.5;fill:none}
      .thin{stroke:#9DB4B8;stroke-width:1.8;fill:none}
      .dot{fill:#0E4C5A}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F3F6F6"/>

  <!-- 제목 -->
  <rect x="60" y="40" width="8" height="64" rx="4" fill="#0E4C5A"/>
  <text x="88" y="78" font-size="34" font-weight="800" fill="#13292E">시니어 동네 점검단 · 시스템 구성</text>
  <text x="88" y="106" font-size="17" fill="#52666B">앱 → 업무 백엔드 → AI 판독 모듈 순서로만 호출합니다. 사진은 휴대폰에서 먼저 가린 뒤 보냅니다.</text>

  <!-- 구역 이름 -->
  <g font-size="13" font-weight="700" fill="#7A8A8E" letter-spacing="2">
    <text x="60" y="170">사용자</text>
    <text x="500" y="170">업무 서버</text>
    <text x="984" y="170">내부망 · 외부 비공개</text>
  </g>
  <rect x="960" y="150" width="580" height="342" rx="20" fill="none" stroke="#C9D5D6" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- 시니어 앱 -->
  <g filter="url(#sh)"><rect x="60" y="190" width="320" height="130" rx="14" class="card"/></g>
  <rect x="60" y="190" width="320" height="52" fill="#E3ECEC" clip-path="url(#cS)"/>
  <rect x="80" y="202" width="18" height="28" rx="4" fill="none" stroke="#0E4C5A" stroke-width="2.2"/>
  <line x1="86" y1="225" x2="92" y2="225" stroke="#0E4C5A" stroke-width="2.2" stroke-linecap="round"/>
  <text x="112" y="224" class="hd" fill="#13292E">시니어 앱</text>
  <text x="364" y="223" text-anchor="end" class="sub" fill="#52666B">PWA · 휴대폰</text>
  <text x="84" y="274" class="b">촬영 · 장소 안내</text>
  <text x="84" y="302" class="b">얼굴·번호판 기기에서 가림</text>

  <!-- 관리자 웹 -->
  <g filter="url(#sh)"><rect x="60" y="340" width="320" height="130" rx="14" class="card"/></g>
  <rect x="60" y="340" width="320" height="52" fill="#E3ECEC" clip-path="url(#cA)"/>
  <rect x="78" y="353" width="24" height="17" rx="3" fill="none" stroke="#0E4C5A" stroke-width="2.2"/>
  <line x1="84" y1="378" x2="96" y2="378" stroke="#0E4C5A" stroke-width="2.2" stroke-linecap="round"/>
  <text x="112" y="374" class="hd" fill="#13292E">관리자 웹</text>
  <text x="364" y="373" text-anchor="end" class="sub" fill="#52666B">PC 브라우저</text>
  <text x="84" y="424" class="b">사진 검토 · 판정</text>
  <text x="84" y="452" class="b">보수 · 수리 확인 · 통계</text>

  <!-- 업무 백엔드 -->
  <g filter="url(#sh)"><rect x="500" y="190" width="340" height="280" rx="14" class="card"/></g>
  <rect x="500" y="190" width="340" height="64" fill="#0E4C5A" clip-path="url(#cB)"/>
  <g fill="none" stroke="#fff" stroke-width="2"><rect x="520" y="206" width="24" height="12" rx="2"/><rect x="520" y="222" width="24" height="12" rx="2"/></g>
  <text x="558" y="230" class="hd" fill="#fff">업무 백엔드</text>
  <text x="824" y="229" text-anchor="end" class="sub" fill="#D5E9EE">Java · Spring Boot</text>
  <g class="b">
    <circle cx="530" cy="296" r="4" class="dot"/><text x="546" y="302">사진 접수 · 저장</text>
    <circle cx="530" cy="338" r="4" class="dot"/><text x="546" y="344">순회 · 검토 · 사건 관리</text>
    <circle cx="530" cy="380" r="4" class="dot"/><text x="546" y="386">로그인 (JWT)</text>
    <circle cx="530" cy="422" r="4" class="dot"/><text x="546" y="428">AI 호출은 여기서만</text>
  </g>

  <!-- 저장소 -->
  <path d="M670,470 L670,516 M552,516 L788,516 M552,516 L552,540 M670,516 L670,540 M788,516 L788,540" class="thin"/>
  <g filter="url(#sh)">
    <rect x="500" y="540" width="104" height="84" rx="12" class="card"/>
    <rect x="618" y="540" width="104" height="84" rx="12" class="card"/>
    <rect x="736" y="540" width="104" height="84" rx="12" class="card"/>
  </g>
  <g text-anchor="middle">
    <text x="552" y="577" font-size="16" font-weight="700" fill="#13292E">PostgreSQL</text>
    <text x="552" y="603" font-size="13.5" fill="#52666B">업무 데이터</text>
    <text x="670" y="577" font-size="16" font-weight="700" fill="#13292E">Redis</text>
    <text x="670" y="603" font-size="13.5" fill="#52666B">로그인 토큰</text>
    <text x="788" y="577" font-size="16" font-weight="700" fill="#13292E">S3</text>
    <text x="788" y="603" font-size="13.5" fill="#52666B">가린 사진</text>
  </g>

  <!-- AI 판독 모듈 -->
  <g filter="url(#sh)"><rect x="984" y="190" width="290" height="280" rx="14" class="card"/></g>
  <rect x="984" y="190" width="290" height="64" fill="#0E4C5A" clip-path="url(#cI)"/>
  <g fill="none" stroke="#fff" stroke-width="2"><circle cx="1015" cy="222" r="11"/><circle cx="1015" cy="222" r="4" fill="#fff"/></g>
  <text x="1038" y="230" class="hd" fill="#fff">AI 판독 모듈</text>
  <text x="1258" y="229" text-anchor="end" class="sub" fill="#D5E9EE">FastAPI</text>
  <g class="b">
    <circle cx="1012" cy="296" r="4" class="dot"/><text x="1028" y="302">개인정보 다시 검사</text>
    <circle cx="1012" cy="338" r="4" class="dot"/><text x="1028" y="344">시설 · 이상 판독</text>
    <circle cx="1012" cy="380" r="4" class="dot"/><text x="1028" y="386">수리 전후 비교</text>
    <circle cx="1012" cy="422" r="4" class="dot"/><text x="1028" y="428">주간 보고 문장</text>
  </g>

  <!-- GPU 서버 -->
  <g filter="url(#sh)"><rect x="1316" y="190" width="200" height="280" rx="14" class="card"/></g>
  <rect x="1316" y="190" width="200" height="64" fill="#E3ECEC" clip-path="url(#cG)"/>
  <g fill="none" stroke="#0E4C5A" stroke-width="2"><rect x="1334" y="211" width="20" height="20" rx="3"/><path d="M1339,207v4M1349,207v4M1339,231v4M1349,231v4M1330,216h4M1330,226h4M1354,216h4M1354,226h4"/></g>
  <text x="1368" y="230" class="hd" fill="#13292E">GPU 서버</text>
  <text x="1340" y="300" class="b" font-weight="700" fill="#0E4C5A">Ollama</text>
  <text x="1340" y="326" font-size="15" fill="#52666B">공개 AI 모델 (qwen3-vl)</text>
  <rect x="1336" y="376" width="160" height="66" rx="10" fill="#E3ECEC"/>
  <text x="1416" y="403" text-anchor="middle" font-size="15" fill="#0E4C5A" font-weight="700">활동 시간에만 켬</text>
  <text x="1416" y="426" text-anchor="middle" font-size="13.5" fill="#0E4C5A">비용 절감</text>

  <!-- 연결 -->
  <path d="M380,255 L496,255" class="ln" marker-end="url(#a)"/>
  <path d="M380,405 L496,405" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="438" y="243" text-anchor="middle" class="lbl">HTTPS</text>
  <text x="438" y="393" text-anchor="middle" class="lbl">HTTPS</text>
  <path d="M840,330 L980,330" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="910" y="318" text-anchor="middle" class="lbl">API 키</text>
  <path d="M1274,330 L1312,330" class="ln" marker-end="url(#a)"/>

  <!-- 처리 흐름 (단계 표시) -->
  <rect x="60" y="672" width="1480" height="150" rx="16" fill="#fff" stroke="#D5E9EE" stroke-width="1.5"/>
  <text x="88" y="708" font-size="18" font-weight="700" fill="#13292E">사진 한 장의 흐름</text>
  <line x1="236" y1="752" x2="1364" y2="752" stroke="#C9D5D6" stroke-width="2"/>
  <g text-anchor="middle">
    <circle cx="236" cy="752" r="18" fill="#3B8EA5"/><text x="236" y="758" font-size="17" font-weight="700" fill="#fff">1</text>
    <text x="236" y="800" font-size="16" fill="#36494D">촬영 · 기기에서 가림</text>
    <circle cx="518" cy="752" r="18" fill="#3B8EA5"/><text x="518" y="758" font-size="17" font-weight="700" fill="#fff">2</text>
    <text x="518" y="800" font-size="16" fill="#36494D">백엔드 접수 · 저장</text>
    <circle cx="800" cy="752" r="18" fill="#3B8EA5"/><text x="800" y="758" font-size="17" font-weight="700" fill="#fff">3</text>
    <text x="800" y="800" font-size="16" fill="#36494D">AI 판독</text>
    <circle cx="1082" cy="752" r="18" fill="#3B8EA5"/><text x="1082" y="758" font-size="17" font-weight="700" fill="#fff">4</text>
    <text x="1082" y="800" font-size="16" fill="#36494D">재촬영 / 다음 장소 안내</text>
    <circle cx="1364" cy="752" r="18" fill="#3B8EA5"/><text x="1364" y="758" font-size="17" font-weight="700" fill="#fff">5</text>
    <text x="1364" y="800" font-size="16" fill="#36494D">담당자 검토 · 보수 요청</text>
  </g>

  <!-- 원칙 -->
  <g font-size="15" fill="#36494D">
    <path d="M62,860 l5,5 l10,-11" stroke="#0E4C5A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="866">원본 사진은 밖으로 보내지 않음</text>
    <path d="M362,860 l5,5 l10,-11" stroke="#0E4C5A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="386" y="866">외부 AI 서비스 사용 안 함</text>
    <path d="M630,860 l5,5 l10,-11" stroke="#0E4C5A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="654" y="866">최종 판정은 항상 담당자</text>
  </g>
</svg>
